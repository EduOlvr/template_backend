  clientId: "api-nexus"
  clientSecret: ""
  tokenEndpoint: "http://localhost:8080/realms/nexus/protocol/openid-connect/token"
  jwksUri: "http://localhost:8080/realms/nexus/protocol/openid-connect/certs"
